<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><title>PlanMark: Concept C, Field Focus</title>
<script src="icons.js"></script><script src="scene-data.js"></script><script src="plan.js"></script><script src="ui.js"></script>
<style>
/* Field Focus: the sheet is the app. Minimal chrome, floating dock, quick radial palette, slide-over panels, giant scale. */
:root[data-theme=light]{--bg:#DCDAD3;--paper:#F6F5F1;--glass:rgba(250,249,246,.82);--solid:#FFFFFF;--sub:#EFEDE7;--line:rgba(23,26,31,.1);--line2:rgba(23,26,31,.18);--tx:#17191E;--tx2:#5B5E66;--tx3:#8C8F97;--ac:#F2551D;--acbg:rgba(242,85,29,.12);--actx:#C2410C;--sel:#F2551D;--ink:#17191E;--sh:0 10px 34px rgba(30,26,20,.18),0 0 0 1px rgba(23,26,31,.08)}
:root[data-theme=dark]{--bg:#0E0F11;--paper:#16181B;--glass:rgba(26,28,32,.84);--solid:#1F2226;--sub:#2A2D33;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);--tx:#F1F0EC;--tx2:#A7A9AF;--tx3:#71747B;--ac:#FF6A2B;--acbg:rgba(255,106,43,.16);--actx:#FF9A6B;--sel:#FF6A2B;--ink:#F1F0EC;--sh:0 14px 40px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.07)}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--tx);font:13px/1.4 "IBM Plex Sans",-apple-system,"Segoe UI Variable",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}svg{display:block}
kbd{font:600 10.5px/1 "Geist Mono",monospace;padding:3px 5px;border-radius:5px;background:var(--sub);color:var(--tx2)}
.glass{background:var(--glass);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);box-shadow:var(--sh)}
.canvas{position:absolute;inset:0;display:grid;place-items:center}
.sheet{position:relative;width:1180px;aspect-ratio:1224/792;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.sheet img{width:100%;height:100%;display:block}.sheet svg{position:absolute;inset:0;width:100%;height:100%}
.mtip{position:absolute;transform:translate(12px,-60%);background:var(--ink);color:var(--paper);padding:8px 12px;border-radius:12px;font:600 15px/1.2 "Geist Mono";white-space:nowrap}
.mtip small{display:block;font:500 11.5px "IBM Plex Sans";opacity:.75}
/* top-left doc pill */
.doc{position:absolute;left:14px;top:14px;display:flex;align-items:center;gap:10px;height:44px;padding:0 8px 0 10px;border-radius:14px}
.doc b{font-weight:600}.doc span{color:var(--tx2);font-size:12px}
.ib{width:32px;height:32px;display:grid;place-items:center;border-radius:9px;color:var(--tx2)}.ib:hover{background:var(--sub)}.ib svg{width:18px;height:18px}
.ib.sm{width:26px;height:26px}.ib.sm svg{width:15px;height:15px}.ib.faint{color:var(--tx3);opacity:.7}
.saved{display:flex;align-items:center;gap:6px;color:var(--tx2);font-size:12px;padding:0 6px}.saved i{width:7px;height:7px;border-radius:50%;background:#22A06B}
/* giant scale */
.scalecard{position:absolute;right:14px;top:14px;border-radius:16px;padding:10px 14px 10px 16px;display:flex;align-items:center;gap:16px}
.scalecard .big{font:700 34px/1 "Barlow Condensed","IBM Plex Sans",sans-serif;letter-spacing:.01em}
.scalecard .meta{font-size:11.5px;color:var(--tx2);line-height:1.35}.scalecard .meta b{color:#22A06B;font-weight:600;display:flex;align-items:center;gap:4px}
.scalecard .meta b svg{width:13px;height:13px}
.bar{display:flex;flex-direction:column;gap:3px;font:500 9.5px "Geist Mono";color:var(--tx2)}.bar i{display:flex;height:7px;width:120px;border:1.5px solid var(--ink)}.bar i::before{content:"";width:50%;background:var(--ink)}.bar div{display:flex;justify-content:space-between}
.recal{height:32px;padding:0 12px;border-radius:10px;background:var(--sub);font-weight:600;font-size:12px}
/* dock */
.dock{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:6px;border-radius:20px}
.d{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:var(--tx2);position:relative;transition:transform .1s,background .1s}
.d:hover{background:var(--sub)}.d:active{transform:scale(.94)}.d svg{width:22px;height:22px}
.d.on{background:var(--ink);color:var(--paper)}
.d.acc{background:var(--ac);color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--ac) 45%,transparent)}
.d .k{position:absolute;right:4px;bottom:3px;font:600 8.5px "Geist Mono";color:var(--tx3)}.d.on .k{color:var(--paper);opacity:.6}
.d.group{width:auto;padding:0 12px 0 10px;display:flex;gap:7px;font-weight:600;font-size:12.5px}
.d.group .cur{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--acbg);color:var(--actx)}.d.group .cur svg{width:18px;height:18px}
.d.group .chev{width:12px;height:12px;opacity:.5}
.dsep{width:1px;height:28px;background:var(--line2);margin:0 4px}
.zoomp{display:flex;align-items:center;gap:2px;padding:0 4px;font:600 12px "Geist Mono";color:var(--tx2)}
/* radial */
.radial{position:absolute;width:250px;height:250px;border-radius:50%;transform:translate(-50%,-50%)}
.radial .ring{position:absolute;inset:0;border-radius:50%;background:var(--glass);backdrop-filter:blur(18px);box-shadow:var(--sh);-webkit-mask:radial-gradient(circle,transparent 44px,#000 45px);mask:radial-gradient(circle,transparent 44px,#000 45px)}
.radial .hub{position:absolute;left:50%;top:50%;width:80px;height:80px;transform:translate(-50%,-50%);border-radius:50%;display:grid;place-items:center;text-align:center;font-size:11px;color:var(--tx2);line-height:1.2}
.radial .hub b{display:block;color:var(--tx);font-size:13px}
.ri{position:absolute;width:48px;height:48px;margin:-24px;border-radius:50%;display:grid;place-items:center;color:var(--tx)}.ri svg{width:22px;height:22px}
.ri.on{background:var(--ac);color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--ac) 50%,transparent)}
.ri small{position:absolute;top:44px;font:600 9.5px "IBM Plex Sans";color:var(--tx2);white-space:nowrap}.ri.on small{color:var(--actx)}
.rhint{position:absolute;transform:translate(-50%,0);font-size:12px;color:var(--tx2);padding:6px 10px;border-radius:9px;white-space:nowrap}
/* slide-over */
.over{position:absolute;top:70px;bottom:84px;width:320px;border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.over.r{right:14px}.over.l{left:14px}
.oh{display:flex;align-items:center;gap:8px;padding:12px 10px 8px 16px;font-weight:600;font-size:14px}.oh .sp{flex:1}
.otabs{display:flex;gap:16px;padding:0 16px;border-bottom:1px solid var(--line)}.otabs button{padding:8px 0;font-weight:600;color:var(--tx2);border-bottom:2px solid transparent;font-size:12.5px}.otabs button.on{color:var(--tx);border-color:var(--ac)}
.ob{flex:1;overflow:auto;padding:4px 16px 16px}
.ph{display:flex;align-items:center;gap:10px;padding:10px 0}
.ph-ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}.ph-ic svg{width:20px;height:20px}
:root[data-theme=dark] .ph-ic,:root[data-theme=dark] .mic{filter:brightness(1.6)}
.ph-t{font-weight:600;font-size:14px}.ph-s{color:var(--tx2);font-size:12px}.ph .ib{margin-left:auto}
.measure{padding:12px 14px;border-radius:14px;background:var(--ink);color:var(--paper)}
.m-main{display:flex;gap:6px;align-items:baseline}.m-v{font:700 30px/1.05 "Barlow Condensed";letter-spacing:.01em}.m-u{opacity:.7;font-weight:600}
.m-sub{display:flex;gap:8px;align-items:center;opacity:.8;font-variant-numeric:tabular-nums}.dotsep{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.6}
.m-scale{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11.5px;opacity:.75}.m-scale svg{width:14px;height:14px}
.link{margin-left:auto;color:var(--ac);font-weight:600;font-size:11.5px}
section{padding:10px 0 4px;border-bottom:1px solid var(--line)}section:last-of-type{border:0}
h4{margin:2px 0 10px;font:600 11px/1 "IBM Plex Sans";letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);display:flex;align-items:center;justify-content:space-between}h4 .cap{text-transform:none;letter-spacing:0;font-weight:500}
.swatches{display:flex;gap:6px;margin-bottom:10px}.sw{width:26px;height:26px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(127,127,127,.3)}
.sw.on{box-shadow:0 0 0 2.5px var(--solid),0 0 0 4.5px var(--c)}.sw.custom{background:conic-gradient(#E5484D,#FFB224,#30A46C,#0090FF,#7C3AED,#E5484D)}
.field{display:flex;align-items:center;gap:10px;margin:9px 0}.field>label{width:54px;color:var(--tx2);font-size:12px;flex:none}
.slider{flex:1;display:flex;align-items:center;gap:10px}.track{flex:1;height:8px;border-radius:4px;background:var(--sub);position:relative}.fillbar{position:absolute;inset:0 auto 0 0;width:var(--v);background:var(--ac);border-radius:4px}
.knob{position:absolute;left:var(--v);top:50%;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--ac);transform:translate(-50%,-50%)}
output{font:600 12px "Geist Mono";min-width:44px;text-align:right}
.seg{flex:1;display:flex;gap:3px;padding:3px;border-radius:11px;background:var(--sub)}.seg button{flex:1;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--tx2)}
.seg button.on{background:var(--solid);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg.dashes svg{width:38px;height:12px}.seg.widths button{display:flex;flex-direction:column;height:36px}.seg.widths svg{width:24px;height:12px}.seg.widths span{font:600 9.5px "Geist Mono";color:var(--tx3)}.seg.txt button{font-size:11.5px;font-weight:600}
.toggle{width:34px;height:20px;border-radius:10px;background:var(--sub);position:relative}.toggle.on{background:var(--ac)}.toggle i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff}.toggle.on i{left:16px}
.num{display:flex;align-items:center;border-radius:10px;background:var(--sub)}.num button{width:30px;height:32px;color:var(--tx2);font-size:15px}.num span{min-width:50px;text-align:center;font:600 12px "Geist Mono"}
.select,.input{flex:1;height:34px;border-radius:10px;background:var(--sub);display:flex;align-items:center;gap:8px;padding:0 10px;font-size:12.5px}.select svg{width:14px;height:14px;margin-left:auto;color:var(--tx3)}.input.muted{color:var(--tx2)}
.ldot{width:11px;height:11px;border-radius:50%;background:var(--c);flex:none}
.pf{display:flex;gap:6px;padding-top:10px}.btn{flex:1;height:34px;border-radius:10px;background:var(--sub);font-weight:600;font-size:12px}
.lrow{display:flex;align-items:center;gap:10px;height:40px;padding:0 6px 0 10px;border-radius:11px}.lrow.on{background:var(--acbg)}
.ln{flex:1;font-weight:500}.lk{font:600 11px "Geist Mono";color:var(--tx3)}
.lchk{width:18px;height:18px;border-radius:6px;display:grid;place-items:center;background:var(--ink);color:var(--paper)}.lchk svg{width:12px;height:12px}
.mfilter{display:flex;gap:6px;margin:4px 0 8px}.search{flex:1;height:34px;border-radius:10px;background:var(--sub);display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--tx3)}.search svg{width:15px;height:15px}
.mrow{display:flex;align-items:center;gap:10px;padding:8px;border-radius:11px}.mrow.on{background:var(--acbg)}
.mic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}.mic svg{width:17px;height:17px}
.mt{flex:1;min-width:0}.mt b{display:block;font-weight:600}.mt small{display:block;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv{text-align:right;font:600 12px "Geist Mono"}.mv small{display:block;color:var(--tx2);font-weight:500}
.totals{margin-top:10px;padding:12px 14px;border-radius:14px;background:var(--ink);color:var(--paper)}.totals h4{color:inherit;opacity:.6}.totals div{display:flex;justify-content:space-between;padding:3px 0}.totals b{font:600 13px "Geist Mono"}.totals b small{opacity:.7;margin-left:4px}
/* start */
.start{position:absolute;inset:0;background:var(--paper);display:flex;flex-direction:column}
.dropzone{flex:1;margin:18px;border-radius:26px;border:2px dashed var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;position:relative;overflow:hidden;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px}
.dropzone h1{font:700 64px/0.95 "Barlow Condensed";letter-spacing:.005em;margin:6px 0 0;text-transform:uppercase}
.dropzone p{margin:0;color:var(--tx2);font-size:15px}
.dropzone .big{display:flex;gap:10px;margin-top:8px}
.bigbtn{height:52px;padding:0 22px;border-radius:16px;font-weight:600;font-size:15px;display:flex;align-items:center;gap:10px;background:var(--solid);box-shadow:var(--sh)}.bigbtn svg{width:22px;height:22px}
.bigbtn.acc{background:var(--ac);color:#fff;box-shadow:0 6px 20px color-mix(in srgb,var(--ac) 40%,transparent)}
.bigbtn kbd{background:rgba(255,255,255,.22);color:#fff}
.strip{display:flex;gap:14px;padding:0 18px 18px}
.card{flex:1;display:flex;gap:12px;align-items:center;padding:10px;border-radius:16px;background:var(--solid);box-shadow:var(--sh)}
.card img{width:96px;height:62px;object-fit:cover;object-position:left top;border-radius:8px;background:#fff;box-shadow:0 0 0 1px var(--line2)}
.card b{display:block;font-weight:600;font-size:12.5px;line-height:1.25}.card span{font-size:11.5px;color:var(--tx2)}
.privacy{position:absolute;top:18px;right:20px;display:flex;align-items:center;gap:6px;color:var(--tx2);font-size:12px}.privacy svg{width:16px;height:16px;color:#22A06B}
.brandtl{position:absolute;top:18px;left:20px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div id="root"></div>
<script>
const I = IC, v = Q.get('view') || 'main', root = document.getElementById('root');
if (v === 'start') {
  root.innerHTML = `<div class="start"><div class="dropzone"><div class="brandtl">${LOGO(30, '#FF8A4C', '#B93A0B')}PlanMark</div><div class="privacy">${I.shield}Offline · files stay on this device</div>
    ${LOGO(64, '#FF8A4C', '#B93A0B')}<h1>Drop a plan sheet</h1><p>PDF, PNG, JPG or TIFF, anywhere on this screen</p>
    <div class="big"><button class="bigbtn acc">${I.open}Open file <kbd>⌘O</kbd></button><button class="bigbtn">${I.combine}Combine</button><button class="bigbtn">${I.image}Photos / scans to PDF</button></div></div>
    <div class="strip">${UI.recent().slice(0, 3).map(([n, m, t]) => `<div class="card"><img src="${t}" alt=""><div><b>${n}</b><span>${m}</span></div></div>`).join('')}</div></div>`;
} else {
  const D = (id, k, cls = '') => `<button class="d ${cls}" aria-label="${id}" title="${id} (${k})">${I[id]}${k ? `<span class="k">${k}</span>` : ''}</button>`;
  let html = `<div class="canvas">${planSheet({ tip: v === 'main' ? '16,579.04 sq ft<small>0.381 ac · perim. 504.05 ft</small>' : '', select: v !== 'radial' })}</div>
    <div class="doc glass">${LOGO(26, '#FF8A4C', '#B93A0B')}<div><b>W-1 Riverbend Commons</b> <span>· page 1 of 2</span></div><span class="saved"><i></i>Saved</span><button class="ib">${I.chevd}</button></div>
    <div class="scalecard glass" title="Current scale for page 1"><div><div class="big">1″ = 50′</div></div><div class="bar"><i></i><div><span>0</span><span>50</span><span>100 ft</span></div></div><div class="meta"><b>${I.check}Calibrated</b>on sheet scale bar</div><button class="recal">Recalibrate <kbd>K</kbd></button></div>
    <nav class="dock glass" aria-label="Tools">${D('select', 'V', v === 'radial' ? '' : 'on')}${D('pan', 'H')}<span class="dsep"></span>
      <button class="d group"><span class="cur">${I.cloud}</span>Markup${I.chevd.replace('<svg', '<svg class="chev"')}</button>
      <button class="d group"><span class="cur">${I['m-area']}</span>Measure${I.chevd.replace('<svg', '<svg class="chev"')}</button><span class="dsep"></span>
      ${D('undo', '')}${D('redo', '')}<span class="dsep"></span><span class="zoomp">${I.minus.replace('<svg', '<svg width=16')}86%${I.plus.replace('<svg', '<svg width=16')}</span><span class="dsep"></span>
      ${D('layers', 'L', v === 'panel' ? 'on' : '')}${D('sliders', 'I', v === 'main' ? 'on' : '')}${D('save', 'S', 'acc')}</nav>`;
  if (v === 'main') html += `<aside class="over r glass"><div class="oh">Selection<span class="sp"></span><button class="ib sm">${I.close}</button></div><div class="ob">${UI.props()}</div></aside>`;
  if (v === 'panel') html += `<aside class="over l glass"><div class="oh">Layers & markups<span class="sp"></span><button class="ib sm">${I.close}</button></div><div class="otabs"><button class="on">Layers</button><button>Markups</button><button>Pages</button></div><div class="ob">${UI.layers()}<section><h4>Markups <span class="cap">7 on this page</span></h4>${UI.markups()}</section></div></aside>`;
  if (v === 'radial') {
    const cx = 760, cy = 420, R = 88;
    const items = [['select', 'Select'], ['pen', 'Pen'], ['cloud', 'Cloud'], ['callout', 'Callout'], ['m-length', 'Length'], ['m-area', 'Area'], ['m-count', 'Count'], ['calibrate', 'Calibrate']];
    html += `<div class="radial" style="left:${cx}px;top:${cy}px"><div class="ring"></div><div class="hub glass"><div><b>Area</b>4</div></div>${items.map(([id, l], i) => { const a = -Math.PI / 2 + (i * 2 * Math.PI) / items.length; return `<button class="ri${id === 'm-area' ? ' on' : ''}" style="left:${125 + R * Math.cos(a)}px;top:${125 + R * Math.sin(a)}px">${I[id]}<small>${l}</small></button>`; }).join('')}</div>
      <div class="rhint glass" style="left:${cx}px;top:${cy + 140}px">Hold <kbd>Space</kbd> or right-click for quick tools · release on a tool</div>`;
  }
  root.innerHTML = html;
}
</script></body></html>
